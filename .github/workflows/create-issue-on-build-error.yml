name: Create Issue on Workflow Failure

on:
  workflow_run:
    workflows: ['*']
    types:
      - completed

jobs:
  create-issue:
    env:
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      OLLAMA_MODEL: qwen3.5:9b
      OLLAMA_FALLBACK_MODEL: qwen3.5:4b
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: xcode-27-xlarge
    steps:
      - name: Create GitHub Issue
        id: create_issue
        uses: actions/github-script@v9
        with:
          script: |
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Workflow Failure: ${context.payload.workflow_run.name}`,
              body: `The workflow **${context.payload.workflow_run.name}** failed. Please investigate.\n\n[View the failed workflow run](${context.payload.workflow_run.html_url})`,
              labels: ["automation", "devin", "claude", "workflow-failure"]
            });
            console.log(`Created issue: ${issue.html_url}`);
            core.setOutput('issue_number', issue.number);

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pre-Install Boost, LevelDB
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: |
            brew install boost-python3 snappy leveldb

      - name: Set up Ollama
        uses: ai-action/setup-ollama@v2

      - uses: actions/cache@v6
        with:
          path: ~/.ollama
          key: ${{ runner.os }}-ollama

      - name: Pull offline model
        run: |
          echo "Free memory before:"; vm_stat
          if ollama pull "${{ env.OLLAMA_MODEL }}" && ollama run "${{ env.OLLAMA_MODEL }}" hi; then
            echo "OLLAMA_MODEL=${{ env.OLLAMA_MODEL }}" >> $GITHUB_ENV
            echo "Using primary model: ${{ env.OLLAMA_MODEL }}"
          else
            echo "Primary model unavailable; falling back to ${{ env.OLLAMA_FALLBACK_MODEL }}"
            ollama pull ${{ env.OLLAMA_FALLBACK_MODEL }}
            ollama run ${{ env.OLLAMA_FALLBACK_MODEL }} hi
            echo "OLLAMA_MODEL=${{ env.OLLAMA_FALLBACK_MODEL }}" >> $GITHUB_ENV
          fi
          ollama ps
          sysctl -n machdep.cpu.brand_string
          sysctl -n hw.memsize
          echo "Free memory after:"; vm_stat

      - name: Post Claude RCA comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_MODEL: ${{ env.OLLAMA_MODEL }}
        run: |
          ISSUE_NUMBER="${{ steps.create_issue.outputs.issue_number }}"
          WORKFLOW_NAME="${{ github.event.workflow_run.name }}"
          WORKFLOW_URL="${{ github.event.workflow_run.html_url }}"
          PROMPT="Resolve & PR (with link to original issue) fix, autoconfirming your plan, Issue ${ISSUE_NUMBER}: Workflow Failure: ${WORKFLOW_NAME}

          The workflow **${WORKFLOW_NAME}** failed. Please investigate.

          [View the failed workflow run](${WORKFLOW_URL})"
          ESCAPED_PROMPT=$(printf '%s' "$PROMPT" | jq -Rs .)
          rm -f /tmp/claude-response-part-*
          ollama launch --yes claude --model "${{ env.OLLAMA_MODEL }}" \
            -- -p "RCA: $ESCAPED_PROMPT" \
            --allow-dangerously-skip-permissions \
            --dangerously-skip-permissions \
            --effort max --no-session-persistence |
          awk -v max=50000 -v prefix=/tmp/claude-response-part- -v issue="$ISSUE_NUMBER" '
            function flush() {
              if (have) {
                close(file)
                system("gh issue comment " issue " --body-file " file)
                idx++
                file=prefix idx
                len=0
                have=0
                blank=0
              }
            }
            BEGIN { idx=0; file=prefix idx; len=0; have=0; blank=0 }
            {
              if ($0 == "") {
                if (blank) { flush(); blank=0; next }
                blank=1
                if (have) { print "" >> file; len += 1 }
                next
              }
              blank=0
              if ($0 ~ /^#+ / || $0 ~ /^---+$/) { flush() }
              if (tolower($0) ~ /check(ing)? in ~/) { flush() }
              if (tolower($0) ~ /waiting for completion/) { flush() }
              if (tolower($0) ~ /onitoring continue/) { flush() }
              if (tolower($0) ~ /ontinuing to monitor/) { flush() }
              if (have && len + length($0) + 1 > max) { flush() }
              if (!have) { file=prefix idx; print $0 > file; have=1; len=length($0) }
              else { print $0 >> file; len += length($0)+1 }
            }
            END { flush() }
          '
