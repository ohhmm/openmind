name: React to PR Review Comments

on:
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  process-review-comment:
    runs-on: macos-latest
    env:
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      OLLAMA_MODEL: qwen3.5:9b
      OLLAMA_FALLBACK_MODEL: qwen3.5:4b
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ollama
        uses: ai-action/setup-ollama@v2

      - uses: actions/cache@v6
        with:
          path: |
            ~/.ollama
            ~/.local
          key: ${{ runner.os }}-ollama
          restore-keys: ${{ runner.os }}-ollama-

      - name: Pull offline model
        run: |
          if ollama pull "${{ env.OLLAMA_MODEL }}" && ollama run "${{ env.OLLAMA_MODEL }}" hi; then
            echo "OLLAMA_MODEL=${{ env.OLLAMA_MODEL }}" >> $GITHUB_ENV
            echo "Using primary model: ${{ env.OLLAMA_MODEL }}"
          else
            echo "Primary model unavailable; falling back to ${{ env.OLLAMA_FALLBACK_MODEL }}"
            ollama pull "${{ env.OLLAMA_FALLBACK_MODEL }}"
            ollama run "${{ env.OLLAMA_FALLBACK_MODEL }}" hi
            echo "OLLAMA_MODEL=${{ env.OLLAMA_FALLBACK_MODEL }}" >> $GITHUB_ENV
          fi
          ollama ps

      - name: Decide if new issue is needed and create it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLLAMA_MODEL: ${{ env.OLLAMA_MODEL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          chmod +x ./claude.sh
          PROMPT="PR review comment ${COMMENT_ID} on PR #${PR_NUMBER} in ${REPOSITORY}: "
          PROMPT+="fetch its body via gh, then use the decision model to decide "
          PROMPT+="whether a new GitHub issue should be created from this comment "
          PROMPT+="(follow-up work, bug, feature, task, or other actionable item "
          PROMPT+="not already tracked). If yes, create the issue with gh issue "
          PROMPT+="create, referencing the PR and comment, with labels automation "
          PROMPT+="and triage. If no, take no issue action and explain why. "
          PROMPT+="Do not modify repository code."
          ./claude.sh \
            --allow-dangerously-skip-permissions \
            --dangerously-skip-permissions \
            --effort max \
            --no-session-persistence \
            -p "$PROMPT"
