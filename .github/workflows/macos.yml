name: C/C++ CI macOS ARM

on: [push]

permissions:
  contents: read
  issues: write

jobs:
  build-in-macos:
    env:
        QCI_TOKEN: ${{ secrets.QCI_TOKEN }}
        QCI_API_URL: ${{ secrets.QCI_API_URL }}
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Conan
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install conan==2.0.13
        conan profile detect --force
        mkdir -p ~/.conan2/profiles
        conan install . --build=missing -s build_type=Release
    - name: Create Build Dir
      run: cmake -E make_directory ${{github.workspace}}/build
    - name: Pre-Install Boost, LevelDB
      uses: nick-fields/retry@v2
      with:
        timeout_minutes: 10
        max_attempts: 3
        command: |
          df -h
          vm_stat
          sysctl -n machdep.cpu.brand_string
          sysctl -n hw.memsize
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          brew install \
            boost \
            boost-python3 \
            fann \
            fmt \
            snappy \
            leveldb \
            lz4 \
            redis hiredis \
            rocksdb \
            openssl@3
          df -h
          vm_stat
          sysctl -n machdep.cpu.brand_string
          sysctl -n hw.memsize
    - name: Start Redis
      run: |
        brew services start redis
        max_retries=10
        retry_count=0

        # Verify Redis service and basic operations
        while true; do
          if [ $retry_count -ge $max_retries ]; then
            echo "Redis failed to start after $max_retries attempts"
            brew services list
            brew services info redis
            exit 1
          fi

          if redis-cli ping > /dev/null 2>&1; then
            # Test basic Redis operations
            if redis-cli set test_key test_value > /dev/null 2>&1 && \
               [ "$(redis-cli get test_key)" = "test_value" ]; then
              echo "Redis server is running and operations verified"
              break
            fi
          fi

          echo "Waiting for Redis to start... (attempt $((retry_count + 1)))"
          sleep 3
          ((retry_count++))
        done

        echo "OPENMIND_TEST_REDIS_RETRY_COUNT=5" >> $GITHUB_ENV
        echo "OPENMIND_TEST_REDIS_RETRY_DELAY=3000" >> $GITHUB_ENV
    - name: Configure
      working-directory: ${{github.workspace}}/build
      run: |
        nvidia-smi || true
        cmake ${{github.workspace}} -GXcode -DOPENMIND_BUILD_SAMPLES=OFF -DOPENMIND_BUILD_TESTS=ON -DOPENMIND_BUILD_3RD_PARTY_TESTS=NO -Dleveldb_TAG:STRING="1.23" -DOPENMIND_MATH_USE_LEVELDB_CACHE=OFF -DOPENMIND_STORAGE_LEVELDB=OFF -DOPENMIND_STORAGE_REDIS=ON
    - name: Install prerequisites
      working-directory: ${{github.workspace}}/build
      run: cmake --build ${{github.workspace}}/build --target prerequisites -j `sysctl -n hw.ncpu` --config Release
    - name: Reconfigure to detect newly installed prerequisites
      working-directory: ${{github.workspace}}/build
      run: cmake .
    - name: Build
      id: build
      continue-on-error: true
      working-directory: ${{github.workspace}}/build
      run: |
        set +e
        cmake --build ${{github.workspace}}/build -j `sysctl -n hw.ncpu` --config Release 2>&1 | tee "${{github.workspace}}/build.log"
        status=${PIPESTATUS[0]}
        FIRST_ERROR=$(grep -m1 -iE "error[: ]" "${{github.workspace}}/build.log" || true)
        FIRST_WARNING=$(grep -m1 -iE "warning[: ]" "${{github.workspace}}/build.log" || true)
        printf '%s\n' "$FIRST_ERROR" > "${{github.workspace}}/first_error.txt"
        printf '%s\n' "$FIRST_WARNING" > "${{github.workspace}}/first_warning.txt"
        {
          echo "FIRST_ERROR<<EOF"
          printf '%s\n' "$FIRST_ERROR"
          echo "EOF"
          echo "FIRST_WARNING<<EOF"
          printf '%s\n' "$FIRST_WARNING"
          echo "EOF"
          echo "BUILD_STATUS=$status"
        } >> "$GITHUB_OUTPUT"
        exit "$status"
    - name: Ensure next issue for first build finding
      if: always()
      uses: actions/github-script@v9
      env:
        FIRST_ERROR: ${{ steps.build.outputs.FIRST_ERROR }}
        FIRST_WARNING: ${{ steps.build.outputs.FIRST_WARNING }}
      with:
        script: |
          const err = (process.env.FIRST_ERROR || '').trim();
          const warn = (process.env.FIRST_WARNING || '').trim();
          const finding = err || warn;
          if (!finding) {
            return;
          }
          const kind = err ? 'error' : 'warning';
          const label = 'next';
          const title = 'macOS build ' + kind + ': ' + finding;
          let labelExists = true;
          try {
            await github.rest.issues.getLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: label
            });
          } catch (error) {
            labelExists = false;
          }
          if (!labelExists) {
            await github.rest.issues.createLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: label,
              color: '0075ca',
              description: 'Next item to resolve'
            });
          }
          const openIssues = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            labels: label,
            state: 'open',
            per_page: 100
          });
          const duplicate = openIssues.data.some(function (issue) {
            return issue.title === title;
          });
          if (duplicate) {
            return;
          }
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: title,
            body: 'First ' + kind + ' from macOS build:\n\n```\n' + finding + '\n```\n',
            labels: [label, 'automation']
          });
    - name: Fail job on build error
      if: always()
      run: |
        status="${{ steps.build.outputs.BUILD_STATUS }}"
        if [ -n "$status" ] && [ "$status" != "0" ]; then
          exit "$status"
        fi
    - name: Check
      if: success()
      working-directory: ${{github.workspace}}/build
      env:
        OPENMIND_TEST_REDIS_RETRY_COUNT: 5
        OPENMIND_TEST_REDIS_RETRY_DELAY: 3000
        OPENMIND_TEST_REDIS_LOG_LEVEL: DEBUG
      run: ctest --timeout 3200 -C Release -j `sysctl -n hw.ncpu` -E "ts|Dirac" --output-on-failure
    - name: Dirac tests (if secrets provided)
      if: ${{ env.QCI_TOKEN != '' && env.QCI_API_URL != '' }}
      working-directory: ${{github.workspace}}/build
      run: ctest --timeout 3200 -C Release -j `sysctl -n hw.ncpu` -R "Dirac" --output-on-failure
