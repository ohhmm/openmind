name: C/C++ CI macOS

on: [push]

jobs:
  build-in-macos:

    runs-on: xcode-27-large
    
    steps:
    - uses: actions/checkout@v4
    - name: Create Build Dir
      run: cmake -E make_directory ${{github.workspace}}/build
    - name: Pre-Install Boost, LevelDB
      uses: nick-fields/retry@v2
      with:
        timeout_minutes: 10
        max_attempts: 3
        command: |
          df -h
          vm_stat
          sysctl -n machdep.cpu.brand_string
          sysctl -n hw.memsize
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          brew install \
            boost \
            boost-python3 \
            fann \
            fmt \
            snappy \
            leveldb \
            lz4 \
            rocksdb
          df -h
          vm_stat
          sysctl -n machdep.cpu.brand_string
          sysctl -n hw.memsize
    - name: Configure
      working-directory: ${{github.workspace}}/build
      run: |
        nvidia-smi || true
        cmake ${{github.workspace}} -GXcode -DOPENMIND_BUILD_SAMPLES=OFF -DOPENMIND_BUILD_TESTS=ON -DOPENMIND_BUILD_3RD_PARTY_TESTS=NO -Dleveldb_TAG:STRING="1.23" -DOPENMIND_MATH_USE_LEVELDB_CACHE=OFF -DOPENMIND_STORAGE_LEVELDB=OFF
    - name: Install prerequisites
      working-directory: ${{github.workspace}}/build
      run: cmake --build ${{github.workspace}}/build --target prerequisites -j `sysctl -n hw.ncpu` --config Release
    - name: Reconfigure to detect newly installed prerequisites
      working-directory: ${{github.workspace}}/build
      run: cmake .
    - name: Build
      working-directory: ${{github.workspace}}/build
      run: |
        set +e
        cmake --build ${{github.workspace}}/build -j `sysctl -n hw.ncpu` --config Release 2>&1 | tee "${{github.workspace}}/build.log"
        status=${PIPESTATUS[0]}
        echo "=== First error ==="
        grep -m1 -iE "error[: ]" "${{github.workspace}}/build.log" || echo "(none)"
        echo "=== First warning ==="
        grep -m1 -iE "warning[: ]" "${{github.workspace}}/build.log" || echo "(none)"
        exit $status
    - name: Check
      working-directory: ${{github.workspace}}/build
      run: ctest --timeout 3200 -C Release -j `sysctl -n hw.ncpu` -E ts --output-on-failure
