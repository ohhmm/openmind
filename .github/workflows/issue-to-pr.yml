name: Create Devin Session from Issue

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  create-devin-session:
    runs-on: xcode-27
    env:
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      OLLAMA_MODEL: qwen3.5:9b
      OLLAMA_FALLBACK_MODEL: qwen3.5:4b
    # Only run on issues that are either newly created by humans
    # or labeled with "devin" (including those created by automation)
    if: >
      (github.event.action == 'opened')
    steps:
      - name: OS prerequisites
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 5
          command: |
            brew install boost boost-python3 snappy leveldb rocksdb fmt lz4 ninja gh

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select issue to resolve
        id: select-issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Prioritize open issues labeled "next" (oldest first).
          NEXT_CANDIDATE=$(gh issue list \
            --label next --state open --limit 50 \
            --json number,labels,createdAt \
            | jq -r 'sort_by(.createdAt) \
              | map(select((.labels | map(.name) | index("in-progress")) == null)) \
              | .[0].number // empty')
          if [ -n "$NEXT_CANDIDATE" ]; then
            echo "Selected prioritized 'next' issue: #$NEXT_CANDIDATE"
            ISSUE_NUMBER="$NEXT_CANDIDATE"
          else
            ISSUE_NUMBER="${{ github.event.issue.number }}"
          fi
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Get issue content
        id: issue-content
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER="${{ steps.select-issue.outputs.issue_number }}"
          ISSUE_JSON=$(gh issue view "$ISSUE_NUMBER" --json title,body)
          ISSUE_TITLE=$(echo "$ISSUE_JSON" | jq -r '.title')
          ISSUE_BODY=$(echo "$ISSUE_JSON" | jq -r '.body // ""')

          PROMPT="Resolve & PR (with link to original issue) fix, autoconfirming your plan, Issue ${ISSUE_NUMBER}: ${ISSUE_TITLE}

          ${ISSUE_BODY}"

          echo "prompt<<EOF" >> $GITHUB_OUTPUT
          printf '%s\n' "$PROMPT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Check for existing Devin session
        id: check-session
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER="${{ steps.select-issue.outputs.issue_number }}"
          LABELS=$(gh issue view "$ISSUE_NUMBER" --json labels -q '.labels[].name')
          if echo "$LABELS" | grep -q "in-progress"; then
            echo "Issue already has in-progress label, skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          COMMENTS=$(gh issue view "$ISSUE_NUMBER" --json comments -q '.comments[].body')
          if echo "$COMMENTS" | grep -q "Created Devin session:"; then
            echo "Issue already has a Devin session comment, skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Set up Ollama
        uses: ai-action/setup-ollama@v2

      - uses: actions/cache@v6
        with:
          path: |
            ~/.ollama
            ~/.local
          key: ${{ runner.os }}-ollama

      - name: Pull offline model
        run: |
          if ollama pull "${{ env.OLLAMA_MODEL }}" && ollama run "${{ env.OLLAMA_MODEL }}" hi; then
            echo "OLLAMA_MODEL=${{ env.OLLAMA_MODEL }}" >> $GITHUB_ENV
            echo "Using primary model: ${{ env.OLLAMA_MODEL }}"
          else
            echo "Primary model unavailable; falling back to ${{ env.OLLAMA_FALLBACK_MODEL }}"
            ollama pull ${{ env.OLLAMA_FALLBACK_MODEL }}
            ollama run ${{ env.OLLAMA_FALLBACK_MODEL }} hi
            echo "OLLAMA_MODEL=${{ env.OLLAMA_FALLBACK_MODEL }}" >> $GITHUB_ENV
          fi
          ollama ps

      - name: Create Devin Session
        id: devin-session
        if: steps.check-session.outputs.skip != 'true'
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          ISSUE_NUMBER="${{ steps.select-issue.outputs.issue_number }}"
          ESCAPED_PROMPT=$(echo "${{ steps.issue-content.outputs.prompt }}" | jq -Rs .)

          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer $DEVIN_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"prompt\": $ESCAPED_PROMPT}" \
            "https://api.devin.ai/v1/sessions")

          ERROR_MSG=$(echo "$RESPONSE" | jq -r '.error // .detail // empty')
          if [ -n "$ERROR_MSG" ]; then
            echo "Error creating Devin session: $ERROR_MSG"
            exit 1
          fi

          SESSION_ID=$(echo "$RESPONSE" | jq -r '.session_id // empty')
          SESSION_URL=$(echo "$RESPONSE" | jq -r '.url // empty')

          if [ -z "$SESSION_ID" ] || [ -z "$SESSION_URL" ]; then
            echo "Error: Devin session details are missing from the response."
            exit 1
          fi

          # Add label upon successful start
          gh issue edit "$ISSUE_NUMBER" --add-label "devin"

          # Add comment to issue with session link
          gh issue comment "$ISSUE_NUMBER" --body "Created Devin session: $SESSION_URL"

      - name: Run Claude RCA
        id: claude-rca
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_MODEL: ${{ env.OLLAMA_MODEL }}
        run: |
          ISSUE_NUMBER="${{ steps.select-issue.outputs.issue_number }}"
          ESCAPED_PROMPT=$(echo "${{ steps.issue-content.outputs.prompt }}" | jq -Rs .)
          CLAUDE_RESPONSE=$(ollama launch --yes claude --model "${{ env.OLLAMA_MODEL }}" \
            -- -p "RCA: $ESCAPED_PROMPT" --allow-dangerously-skip-permissions \
            --dangerously-skip-permissions --effort max --no-session-persistence)
          # Add label upon successful start
          gh issue edit "$ISSUE_NUMBER" --add-label "claude"
          gh issue comment "$ISSUE_NUMBER" --body "$CLAUDE_RESPONSE"
